spring.application.name=Apex

# Local PostgreSQL connection. The password must be supplied as an environment variable.
spring.datasource.url=${APEX_DB_URL:jdbc:postgresql://localhost:5432/apex_db}
spring.datasource.username=${APEX_DB_USERNAME:apex_app}
spring.datasource.password=${APEX_DB_PASSWORD}

# Flyway owns the database structure; Hibernate only checks that it matches the code.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Keep Apex private to this laptop for now. Stage 17 will enable same-Wi-Fi phone access.
server.address=${APEX_SERVER_ADDRESS:127.0.0.1}
server.port=${APEX_SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${APEX_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
